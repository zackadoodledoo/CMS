<a
  class="list-group-item clearfix"
  [routerLink]="[contact.id]"
  routerLinkActive="active"
>
  <div class="row" style="margin-bottom: 10px; cursor: pointer;">
    <div class="col-xs-9">
      <h4>{{ contact.name }}</h4>
    </div>

    <div class="col-xs-3">
      <img
        [src]="contact.imageUrl"
        alt="{{ contact.name }}"
        class="img-responsive img-thumbnail"
      />
    </div>
  </div>
</a>
